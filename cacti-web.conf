<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    Alias /cacti /var/www/html/cacti
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    <IfModule mod_rewrite.c>
    RewriteEngine On
    RedirectMatch ^/$ /cacti/
    </IfModule>
    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    <Directory /var/www/html/cacti/>
        DirectoryIndex index.php
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/apache2-error.log
    LogLevel warn
    CustomLog /var/log/apache2/apache2-access.log combined
    ServerSignature Off
</VirtualHost>

<VirtualHost *:443 *.7070>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    Alias /cacti /var/www/html/cacti
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    <IfModule mod_rewrite.c>
    RewriteEngine On
    RedirectMatch ^/$ /cacti/
    </IfModule>
    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    <Directory /var/www/html/cacti/>
        DirectoryIndex index.php
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "/root/cert.pem"
    SSLCertificateKeyFile "/root/key.pem"


    ErrorLog /var/log/apache2/apache2-ssl-error.log
    LogLevel warn
    CustomLog /var/log/apache2/apache2-ssl-access.log combined
    ServerSignature Off
</VirtualHost>

